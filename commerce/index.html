<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14213d">
<title>Mon commerce – Nexvia RDC</title>
<link rel="stylesheet" href="/assets/nx.css">
</head>
<body>
<div id="app"><main><p class="muted">Chargement…</p></main></div>
<script src="/assets/nx.js"></script>
<script>
(async function () {
  const { h, api, toast, entete, vider, wa, date, dollars, reduirePhoto, CFG } = NX, app = document.getElementById("app");
  const CAT = { restaurant: "Restaurant", pharmacie: "Pharmacie", banque: "Banque", hotel: "Hôtel", bar: "Bar / loisirs", ecole: "École", distributeur: "Distributeur", "station-service": "Station-service", autre: "Autre" };
  const LIB_DEM = { en_attente: ["En vérification", "warn"], a_verifier: ["À vérifier", "bad"], active: ["Activé", "ok"], rejetee: ["Rejeté", "gris"] };
  let etat = null, edition = null, lieux = null, formule = "standard";

  async function charger() {
    try { etat = await api("GET", "commerce/etat"); }
    catch (e) { if (e.status === 401) { location.href = "/compte/?suite=/commerce/"; return; } vider(app); app.append(h("main", {}, h("div", { class: "alerte bad" }, e.message))); return; }
    rendre();
  }
  const planActuel = () => etat.plans[etat.marque.plan_effectif];
  async function action(btn, fn, ok) {
    if (btn) btn.disabled = true;
    try { await fn(); if (ok) toast(ok); await charger(); } catch (e) { toast(e.message, true); if (btn) btn.disabled = false; }
  }

  // ---------- alertes liées aux paiements ----------
  function bannieres() {
    const out = [];
    const m = etat.marque, pl = etat.plans;
    for (const d of etat.demandes) {
      const nomPlan = pl[d.plan].nom;
      if (d.statut === "en_attente") out.push(h("div", { class: "alerte info" }, h("b", {}, "Merci !"), " Votre paiement (référence ", h("span", { class: "code" }, d.ref), ") est enregistré. Votre abonnement ", nomPlan, " sera vérifié et activé sous 24 heures."));
      if (d.statut === "a_verifier") {
        const msg = "Bonjour Nexvia RDC, j'ai acheté l'abonnement " + nomPlan + " (" + dollars(pl[d.plan].prix) + ") pour « " + m.nom + " », mais mon abonnement n'a pas été activé. Ma référence de paiement : " + d.ref + ". Pourriez-vous vérifier ?";
        out.push(h("div", { class: "alerte warn" }, h("b", {}, "Nous n'avons pas pu faire correspondre votre paiement."), " Référence ", h("span", { class: "code" }, d.ref), ". Contactez notre service client : le message est déjà écrit.", h("br", {}), h("a", { class: "btn wa", href: wa(msg), target: "_blank", rel: "noopener" }, "Contacter le service client sur WhatsApp")));
      }
    }
    return out;
  }

  // ---------- adresses ----------
  function photosBloc(a) {
    const p = planActuel(), bloc = h("div", {});
    const liste = h("div", { class: "photos" }, a.photos.map(id => h("div", { class: "ph" },
      h("img", { src: "/api/photo/" + id, alt: "Photo de " + a.nom, loading: "lazy" }),
      h("button", { type: "button", "aria-label": "Supprimer la photo", onclick: ev => { if (confirm("Supprimer cette photo ?")) action(ev.target, () => api("POST", "commerce/photo/supprimer", { id })); } }, "×"))));
    const fichier = h("input", { type: "file", accept: "image/*", class: "cache", onchange: async () => {
      const f = fichier.files[0]; if (!f) return;
      try { toast("Envoi de la photo…"); const r = await reduirePhoto(f); await api("POST", "commerce/photo", { adresse_id: a.id, ...r }); toast("Photo ajoutée."); await charger(); } catch (e) { toast(e.message, true); }
    } });
    const reste = p.photos - a.photos.length;
    bloc.append(liste, fichier, h("button", { type: "button", class: "btn alt small", disabled: reste <= 0, onclick: () => fichier.click() }, "Ajouter une photo (" + a.photos.length + "/" + p.photos + ")"));
    if (reste <= 0 && etat.marque.plan_effectif !== "premium") bloc.append(h("p", { class: "muted" }, "Limite atteinte avec la formule " + p.nom + ". Une formule supérieure permet plus de photos."));
    return bloc;
  }
  function carteAdresse(a) {
    const st = { en_attente: ["En attente de validation", "warn"], validee: ["Validée", "ok"], refusee: ["Refusée", "bad"] }[a.statut] || ["", "gris"];
    const c = h("div", { class: "card" },
      h("div", { class: "row between" }, h("h3", {}, a.nom), h("span", { class: "badge " + st[1] }, st[0])),
      h("p", { class: "muted" }, a.adresse + (a.commune ? ", " + a.commune : "") + " · " + a.tel),
      a.horaires ? h("p", { class: "muted" }, "Horaires : " + a.horaires) : null);
    if (a.statut === "en_attente") {
      const msg = "Bonjour Nexvia RDC, je veux vérifier mon adresse « " + a.nom + " » (" + etat.marque.nom + "). Mon code : " + a.code;
      c.append(a.tel_verifie
        ? h("div", { class: "alerte ok" }, "Votre numéro est vérifié. Votre fiche est en cours de validation.")
        : h("div", { class: "alerte info" }, "Pour vérifier votre numéro, envoyez ce code par WhatsApp à Nexvia RDC ", h("b", {}, "depuis le numéro de votre commerce (" + a.tel + ")"), " : ", h("span", { class: "code" }, a.code), h("br", {}), h("a", { class: "btn wa small", href: wa(msg), target: "_blank", rel: "noopener" }, "Envoyer mon code par WhatsApp")));
    }
    if (a.statut === "refusee") c.append(h("div", { class: "alerte bad" }, a.note || "Cette adresse n'a pas pu être validée. Contactez-nous pour en savoir plus."));
    c.append(photosBloc(a), h("div", { class: "row", style: "margin-top:8px" },
      h("button", { class: "btn alt small", onclick: () => { edition = a; rendre(); window.scrollTo(0, 0); } }, "Modifier"),
      h("button", { class: "btn danger small", onclick: ev => { if (confirm("Supprimer cette adresse et ses photos ?")) action(ev.target, () => api("POST", "commerce/adresse/supprimer", { id: a.id }), "Adresse supprimée."); } }, "Supprimer")));
    return c;
  }

  async function chargerLieux() { if (lieux) return lieux; try { lieux = await (await fetch("/lieux-index.json")).json(); } catch (e) { lieux = []; } return lieux; }
  const nrm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  function formulaire() {
    const a = edition && edition.id ? edition : null, p = planActuel(), f = {};
    let lat = a ? a.lat : null, lng = a ? a.lng : null, lieu = a ? a.lieu_existant || "" : "";
    const champ = (cle, lib, el, aide) => [h("label", { for: "f_" + cle }, lib), el, aide ? h("p", { class: "muted" }, aide) : null];
    const inp = (cle, attrs) => f[cle] = h("input", { id: "f_" + cle, value: a ? a[cle] || "" : "", ...attrs });
    const ta = (cle, attrs) => { const t = f[cle] = h("textarea", { id: "f_" + cle, ...attrs }); t.value = a ? a[cle] || "" : ""; return t; };
    f.categorie = h("select", { id: "f_categorie" }, Object.keys(CAT).map(k => h("option", { value: k, selected: (a ? a.categorie : "restaurant") === k }, CAT[k])));
    const horairesBloque = !!a && !p.horaires, menuBloque = p.menu === 0;
    const sugg = h("div", {}), msg = h("div", {}), posInfo = h("p", { class: "muted" }, lat != null ? "Position enregistrée ✓" : "");
    const chercher = h("input", { id: "f_lieu", placeholder: "Tapez le nom pour la retrouver…", value: lieu, autocomplete: "off" });
    chercher.addEventListener("input", async () => {
      vider(sugg); lieu = chercher.value.trim(); const t = nrm(lieu); if (t.length < 2) return;
      const L = await chargerLieux(), r = L.filter(x => nrm(x.n).includes(t)).slice(0, 6); if (!r.length) return;
      sugg.append(h("div", { class: "sugg" }, r.map(x => h("button", { type: "button", onclick: () => {
        lieu = x.n; chercher.value = x.n; vider(sugg);
        if (!f.nom.value) f.nom.value = x.n; if (!f.adresse.value && x.a) f.adresse.value = x.a; if (x.c && CAT[x.c]) f.categorie.value = x.c;
      } }, x.n, h("small", {}, (CAT[x.c] || "") + (x.a ? " · " + x.a : ""))))));
    });
    const form = h("form", { class: "card gold", novalidate: true, onsubmit: ev => {
      ev.preventDefault(); vider(msg); const btn = form.querySelector("button[type=submit]");
      action(btn, async () => {
        await api("POST", "commerce/adresse", { id: a ? a.id : undefined, nom: f.nom.value, categorie: f.categorie.value, commune: f.commune.value, adresse: f.adresse.value, tel: f.tel.value, horaires: f.horaires.value, description: f.description.value, menu: f.menu.value, lat, lng, lieu_existant: lieu });
        edition = null;
      }, "Adresse enregistrée.").then(() => {}, () => {});
    } },
      h("h3", {}, a ? "Modifier l'adresse" : "Nouvelle adresse"),
      h("label", {}, "Votre commerce existe déjà sur Nexvia RDC ? ", h("small", {}, "(facultatif : réclamez votre fiche)")), chercher, sugg,
      champ("nom", "Nom de cette adresse", inp("nom", { required: true, maxlength: 100, placeholder: "Ex. Pizza Inn Gombe" })),
      champ("categorie", "Catégorie", f.categorie),
      champ("commune", "Commune", inp("commune", { maxlength: 60, placeholder: "Ex. Gombe" })),
      champ("adresse", "Adresse", inp("adresse", { required: true, maxlength: 200, placeholder: "Avenue, numéro, repère" })),
      champ("tel", "Téléphone du commerce", inp("tel", { type: "tel", required: true, maxlength: 30, placeholder: "+243 …" }), "C'est ce numéro qui sera vérifié par WhatsApp."),
      champ("horaires", "Horaires", Object.assign(inp("horaires", { maxlength: 300, placeholder: "Lun–Sam 9h–22h", disabled: horairesBloque })), horairesBloque ? "Modifier les horaires demande l'abonnement Standard ou Premium." : "Avec la formule Gratuit, les horaires se saisissent à la création."),
      champ("description", "Description", ta("description", { maxlength: 600, placeholder: "Ce qui vous distingue" })),
      champ("menu", "Menu / liste de services", ta("menu", { maxlength: 3000, disabled: menuBloque, placeholder: "Plats, prix, services…" }), menuBloque ? "Disponible avec l'abonnement Standard (2 modifications par mois) ou Premium." : (p.menu < 9999 ? "Formule " + p.nom + " : " + p.menu + " modifications par mois." : "")),
      h("label", {}, "Position sur la carte"),
      h("div", { class: "row" }, h("button", { type: "button", class: "btn alt small", onclick: () => {
        if (!navigator.geolocation) return toast("La position n'est pas disponible sur cet appareil.", true);
        navigator.geolocation.getCurrentPosition(pos => { lat = +pos.coords.latitude.toFixed(6); lng = +pos.coords.longitude.toFixed(6); posInfo.textContent = "Position enregistrée ✓"; }, () => toast("Position refusée ou indisponible.", true), { enableHighAccuracy: true, timeout: 15000 });
      } }, "Utiliser ma position actuelle"), posInfo),
      h("p", { class: "muted" }, "Faites-le depuis votre commerce pour une position exacte."),
      a && a.statut === "validee" ? h("div", { class: "alerte warn" }, "Si vous changez le nom, l'adresse ou le téléphone, la fiche repassera en validation.") : null,
      msg,
      h("div", { class: "row" }, h("button", { type: "submit", class: "btn gold" }, "Enregistrer"), h("button", { type: "button", class: "btn alt", onclick: () => { edition = null; rendre(); } }, "Annuler")));
    return form;
  }

  // ---------- abonnements ----------
  function planCarte(cle) {
    const p = etat.plans[cle], total = etat.total_avec_frais[cle], actif = etat.marque.plan_effectif === cle;
    return h("div", { class: "plan" + (cle === "standard" ? " vedette" : "") },
      h("h3", {}, p.nom, actif ? h("span", { class: "badge ok", style: "margin-left:6px" }, "Actuelle") : null),
      h("div", { class: "prix" }, dollars(p.prix), h("small", {}, " / mois")),
      h("p", { class: "muted" }, "≈ " + dollars(total) + " avec les frais de transaction"),
      h("ul", {}, h("li", {}, p.adresses + " adresse" + (p.adresses > 1 ? "s" : "")), h("li", {}, p.photos + " photos par adresse"), h("li", {}, p.menu >= 9999 ? "Menu modifiable à volonté" : p.menu + " modifications du menu par mois"), h("li", {}, "Badge « Vérifié » et bouton WhatsApp"), p.haut ? h("li", {}, "En haut de votre catégorie") : null, p.stats ? h("li", {}, "Statistiques de vues et d'appels") : null),
      h("button", { class: "btn gold", onclick: () => { formule = cle; rendre(); window.open(CFG.ZOLA_LIEN, "_blank", "noopener"); toast("Saisissez " + dollars(p.prix).replace(",", ".") + " (USD) sur la page de paiement."); } }, actif ? "Renouveler" : "Payer " + dollars(p.prix)));
  }
  function formPaiement() {
    const s = h("select", { id: "p_formule" }, ["standard", "premium"].map(k => h("option", { value: k, selected: formule === k }, etat.plans[k].nom + " – " + dollars(etat.plans[k].prix))));
    const r = h("input", { id: "p_ref", placeholder: "ZOLA-QR-123456", autocomplete: "off", autocapitalize: "characters", maxlength: 60 });
    const form = h("form", { class: "card", novalidate: true, onsubmit: ev => { ev.preventDefault();
      action(form.querySelector("button"), async () => { const d = await api("POST", "commerce/paiement", { plan: s.value, ref: r.value }); toast(d.statut === "active" ? "Votre abonnement est activé !" : "Merci ! Votre abonnement sera vérifié et activé sous 24 heures."); r.value = ""; }).then(() => {}, () => {});
    } },
      h("h3", {}, "J'ai payé : saisir ma référence"),
      h("p", { class: "muted" }, "Sur la page de paiement, saisissez le prix de la formule en dollars ; les frais s'ajoutent automatiquement. Votre référence s'affiche à la fin du paiement et dans l'e-mail envoyé par Zola (pensez à vérifier vos spams)."),
      h("label", { for: "p_formule" }, "Formule payée"), s, h("label", { for: "p_ref" }, "Numéro de référence"), r,
      h("p", {}, h("button", { class: "btn teal", type: "submit" }, "Valider mon paiement")));
    return form;
  }
  function historique() {
    if (!etat.demandes.length) return null;
    return h("div", { class: "card" }, h("h3", {}, "Mes paiements"), h("table", { class: "t" }, h("tr", {}, h("th", {}, "Date"), h("th", {}, "Formule"), h("th", {}, "Référence"), h("th", {}, "État")),
      etat.demandes.map(d => h("tr", {}, h("td", {}, date(d.created_at)), h("td", {}, etat.plans[d.plan].nom), h("td", {}, h("span", { class: "code", style: "font-size:.8rem" }, d.ref)), h("td", {}, h("span", { class: "badge " + LIB_DEM[d.statut][1] }, LIB_DEM[d.statut][0]))))));
  }

  // ---------- page ----------
  function creation() {
    const nom = h("input", { id: "m_nom", maxlength: 100, placeholder: "Ex. Pizza Inn" });
    return h("form", { class: "card gold", novalidate: true, onsubmit: ev => { ev.preventDefault(); action(null, () => api("POST", "commerce/marque", { nom: nom.value }), "Commerce créé."); } },
      h("h3", {}, "Votre commerce"), h("p", {}, "Donnez le nom de votre commerce ou de votre marque. Si vous avez plusieurs adresses (restaurants, agences…), elles seront regroupées sous ce nom."),
      h("label", { for: "m_nom" }, "Nom du commerce ou de la marque"), nom, h("p", {}, h("button", { class: "btn gold", type: "submit" }, "Continuer")));
  }
  function rendre() {
    vider(app); app.append(entete(etat.utilisateur));
    const main = h("main", {});
    if (!etat.marque) { main.append(h("h1", {}, "Mon commerce"), creation()); app.append(main); return; }
    const m = etat.marque, p = planActuel();
    const sm = { en_attente: ["En vérification", "warn"], validee: ["Commerce validé", "ok"], refusee: ["Refusé", "bad"] }[m.statut];
    main.append(h("div", { class: "row between" }, h("h1", {}, m.nom), h("span", { class: "badge " + sm[1] }, sm[0])),
      h("p", { class: "muted" }, "Formule : ", h("b", {}, p.nom), m.plan_effectif !== "gratuit" ? " – active jusqu'au " + date(m.plan_fin) : ""));
    if (m.statut === "en_attente") main.append(h("div", { class: "alerte info" }, "Nous vérifions votre commerce. Vous pouvez déjà préparer vos adresses."));
    if (m.statut === "refusee") main.append(h("div", { class: "alerte bad" }, m.note || "Votre commerce n'a pas pu être validé. Contactez-nous."));
    if (m.plan !== "gratuit" && m.plan_effectif === "gratuit") main.append(h("div", { class: "alerte warn" }, "Votre abonnement " + etat.plans[m.plan].nom + " a expiré : vous êtes revenu à la formule Gratuit. Renouvelez-le ci-dessous."));
    main.append(...bannieres());

    const n = etat.adresses.filter(a => a.statut !== "refusee").length;
    main.append(h("h2", {}, "Mes adresses (" + n + "/" + p.adresses + ")"));
    if (edition) main.append(formulaire());
    else if (n < p.adresses) main.append(h("p", {}, h("button", { class: "btn gold", onclick: () => { edition = {}; rendre(); window.scrollTo(0, 0); } }, "+ Ajouter une adresse")));
    else main.append(h("p", { class: "muted" }, "Vous avez atteint la limite de la formule " + p.nom + ". Passez à une formule supérieure pour ajouter des adresses. Plus de 6 adresses : écrivez-nous pour une offre sur mesure."));
    main.append(...etat.adresses.map(carteAdresse));
    if (!etat.adresses.length && !edition) main.append(h("p", { class: "muted" }, "Aucune adresse pour l'instant."));

    main.append(h("h2", {}, "Abonnement"), h("div", { class: "plans", style: "grid-template-columns:repeat(auto-fit,minmax(230px,1fr))" }, planCarte("standard"), planCarte("premium")), formPaiement());
    const hist = historique(); if (hist) main.append(hist);
    main.append(h("p", { class: "muted" }, "Une question ? ", h("a", { href: wa("Bonjour Nexvia RDC, j'ai une question sur mon compte commerce « " + m.nom + " ».") , target: "_blank", rel: "noopener" }, "Service client sur WhatsApp"), " · ", h("a", { href: "#", onclick: async ev => { ev.preventDefault(); try { await api("POST", "auth/deconnexion"); } catch (e) {} location.href = "/compte/"; } }, "Me déconnecter")));
    app.append(main);
  }
  charger();
})();
</script>
</body>
</html>
