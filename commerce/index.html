<script>
(async function () {

  // Seule la commune de Gombe est ouverte ; les autres arrivent bientôt.

  // ---------- habillage ----------

  // ---------- alertes liées aux paiements ----------

        out.push(h("div", { class: "alerte warn" }, h("b", {}, "Nous n'avons pas pu faire correspondre votre paiement."), " Référence ", h("span", { class: "code" }, d.ref), ". Contactez notre service client : le message est déjà écrit.", h("br", {}), h("a", { class: "btn wa", href: wa(msg), target: "_blank", rel: "noopener" }, "Contacter le service client sur WhatsApp")));
      }

  // ---------- photos (lieu ou menu) : ajout et retrait immédiats, sans recharger la page ----------
  function gestionPhotos(a, type) {
    const p = planSaisie(), menu = type === "menu", cle = menu ? "menu_photos" : "photos", max = menu ? p.menu_photos : p.photos, bloc = h("div", {});
    a[cle] = a[cle] || [];
    function dessiner() {
      vider(bloc);
      if (menu && !max) { bloc.append(h("div", { class: "verrou" }, "Le menu en photos est disponible avec la formule Standard (3 photos) ou Premium (10 photos).")); return; }

        h("img", { src: "/api/photo/" + id, alt: (menu ? "Menu de " : "Photo de ") + a.nom, loading: "lazy" }),

          catch (e) { toast(e.message, true); ev.target.disabled = false; }
        } }, "×"))));
      const fichier = h("input", { type: "file", accept: "image/*", multiple: true, class: "cache", onchange: async () => {
        const fs = [...fichier.files]; fichier.value = "";
        for (const f of fs) {
          if (a[cle].length >= max) { toast("Maximum " + max + " photo" + (max > 1 ? "s" : "") + " avec la formule " + p.nom + ".", true); break; }
          try { toast("Envoi de la photo…"); const r = await reduirePhoto(f); const d = await api("POST", "commerce/photo", { adresse_id: a.id, type: menu ? "menu" : "lieu", ...r }); a[cle].push(d.id); dessiner(); toast("Photo ajoutée."); } catch (e) { toast(e.message, true); break; }
        }

      bloc.append(liste, fichier, h("button", { type: "button", class: "btn alt small", disabled: a[cle].length >= max && true, onclick: () => fichier.click() }, (menu ? "Ajouter une photo du menu" : "Ajouter une photo") + " (" + a[cle].length + "/" + max + ")"));

  // ---------- petites icônes (SVG intégrés) ----------
  const ICONES = {
    pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/>',
    tel: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
    horloge: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    note: '<path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
    photo: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m21 16-5-5-8 8"/>',

    lien: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/>',

  function ico(nom, px) {

    return e;
  }
  // Fiche complète : ce qui aide un commerce à être trouvé et choisi.
  function completude(a) {
    const ps = planSaisie(), ok = [], manque = [];
    const test = (cond, lib) => (cond ? ok : manque).push(lib);
    test(a.tel_verifie, "Numéro vérifié");
    test(a.description && a.description.trim().length >= 20, "Description");
    test(a.horaires, "Horaires");
    test(a.lat != null && a.lng != null, "Position sur la carte");
    test(a.photos && a.photos.length, "Photo du lieu");
    if (ps.menu_photos) test(a.menu_photos && a.menu_photos.length, "Menu en photos");
    const total = ok.length + manque.length;
    return { pct: Math.round(ok.length * 100 / total), ok, manque };
  }
  const ligneInfo = (nom, ...contenu) => h("div", { class: "ligne" }, ico(nom, 17), h("span", {}, ...contenu));

  // ---------- adresses ----------
  function blocStats(a) {
    const plan = etat.marque && etat.marque.plan_effectif;
    if (a.statut !== "validee") return null;
    if (!a.stats) return h("div", { class: "stats verrou" }, ico("couronne", 16), h("span", {}, "Statistiques de vues et d'appels : disponibles avec la formule Premium."));
    const ce = a.stats.ce_mois, pr = a.stats.mois_dernier, L = [["vue", "Fiche vue"], ["appel", "Appels"], ["wa", "WhatsApp"], ["itin", "Itinéraires"], ["fav", "Favoris"]];
    const tend = k => { const d = ce[k] - pr[k]; return pr[k] || ce[k] ? h("small", { class: d > 0 ? "haus" : d < 0 ? "bas" : "" }, (d > 0 ? "+" : "") + d + " (avant : " + pr[k] + ")") : null; };
    return h("div", { class: "stats" }, h("div", { class: "tete-stats" }, h("b", {}, "Statistiques de ce mois-ci"), h("span", { class: "badge gris" }, "Premium")),
      h("div", { class: "cases" }, ...L.map(([k, lib]) => h("div", { class: "case" }, h("strong", {}, String(ce[k])), h("span", {}, lib), tend(k)))),
      h("p", { class: "muted" }, "Les chiffres comptent les personnes qui ouvrent votre fiche ou appuient sur un bouton dans l'application."));
  }
  function carteAdresse(a) {
    const st = { en_attente: ["En attente de validation", "warn"], validee: ["Validée", "ok"], refusee: ["Refusée", "bad"] }[a.statut] || ["", "gris"];
    const nbPh = a.photos ? a.photos.length : 0, c = completude(a);
    const couv = h("div", { class: "couv" }, nbPh ? h("img", { src: "/api/photo/" + a.photos[0], alt: "Photo de " + a.nom, loading: "lazy" }) : h("span", { class: "vide" }, ico("photo", 34), h("small", {}, "Pas encore de photo")), h("span", { class: "badge st " + st[1] }, st[0]),
      nbPh > 1 ? h("span", { class: "nbph" }, ico("photo", 14), nbPh) : null);
    const corps = h("div", { class: "corps" },
      h("div", { class: "entete-adr" }, h("h3", {}, a.nom), h("div", { class: "meta" }, h("span", { class: "badge gris" }, (EMO[a.categorie] || "🏪") + " " + (CAT[a.categorie] || "Autre")), h("span", { class: "badge gris" }, a.commune || "Gombe"))),
      h("div", { class: "infos" },
        ligneInfo("pin", a.adresse), ligneInfo("tel", a.tel),
        a.horaires ? ligneInfo("horloge", horairesJolis(a.horaires).map((x, i) => [i ? h("br", {}) : null, x])) : null,
        a.description ? ligneInfo("note", a.description) : null));
    if (a.statut !== "refusee") corps.append(h("div", { class: "complet" },
      h("div", { class: "haut" }, h("b", {}, c.pct === 100 ? "Fiche complète" : "Fiche complète à " + c.pct + " %"), c.pct === 100 ? h("span", { class: "badge ok" }, "Parfait") : null),
      h("div", { class: "barre" }, h("i", { style: "width:" + c.pct + "%" })),
      c.manque.length ? h("p", { class: "muted" }, "Pour mieux vous faire trouver, ajoutez : " + c.manque.join(", ").toLowerCase() + ".") : null));
    if (a.statut === "en_attente") {
      const msg = "Bonjour Nexvia RDC, je veux vérifier mon adresse « " + a.nom + " » (" + etat.marque.nom + "). Mon code : " + a.code;
      corps.append(a.tel_verifie
        ? h("div", { class: "alerte ok" }, "Votre numéro est vérifié. Votre fiche est en cours de validation.")
        : h("div", { class: "alerte info" }, "Pour vérifier votre numéro, envoyez ce code par WhatsApp à Nexvia RDC ", h("b", {}, "depuis le numéro de cette adresse (" + a.tel + ")"), " : ", h("span", { class: "code" }, a.code), h("br", {}), h("a", { class: "btn wa small", href: wa(msg), target: "_blank", rel: "noopener" }, "Envoyer mon code par WhatsApp")));
    }
    if (a.statut === "refusee") corps.append(h("div", { class: "alerte bad" }, a.note || "Cette adresse n'a pas pu être validée. Contactez-nous pour en savoir plus."));
    const bs = blocStats(a); if (bs) corps.append(bs);
    corps.append(
      h("details", {}, h("summary", {}, h("span", { class: "tt" }, ico("photo", 18), "Photos du lieu"), h("span", { class: "cpt" }, nbPh + " / " + planSaisie().photos)), gestionPhotos(a, "photo")),
      h("details", {}, h("summary", {}, h("span", { class: "tt" }, ico("menu", 18), "Menu / services (photos)")), gestionPhotos(a, "menu")),
      h("div", { class: "actions-adr" },
        h("button", { class: "btn bleu small", onclick: () => { edition = a; rendre(); window.scrollTo(0, 0); } }, ico("crayon", 16), "Modifier la fiche"),
        h("button", { class: "btn supprimer small", onclick: ev => { if (confirm("Supprimer cette adresse et ses photos ?")) action(ev.currentTarget, () => api("POST", "commerce/adresse/supprimer", { id: a.id }), "Adresse supprimée."); } }, ico("corbeille", 16), "Supprimer")));
    return h("div", { class: "adr" }, couv, corps);
  }

  async function chargerLieux() { if (lieux) return lieux; try { lieux = await (await fetch("/lieux-index.json")).json(); } catch (e) { lieux = []; } return lieux; }
  const nrm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  // Choix des photos avant l'envoi : réduites dans le navigateur, envoyées avec la fiche.
  function photosAvantEnvoi(fichiers, max) {
    const zone = h("div", { class: "ajout-photos" }), sel = h("input", { type: "file", accept: "image/*", multiple: true, class: "cache" });
    const dessiner = () => {
      vider(zone);
      fichiers.forEach((x, i) => zone.append(h("div", { class: "ph" }, h("img", { src: x.url, alt: "Photo " + (i + 1) }), h("button", { type: "button", "aria-label": "Retirer la photo", onclick: () => { URL.revokeObjectURL(x.url); fichiers.splice(i, 1); dessiner(); } }, "×"))));
      if (fichiers.length < max) zone.append(h("button", { type: "button", class: "plus", "aria-label": "Ajouter des photos", onclick: () => sel.click() }, "+"));
    };
    sel.addEventListener("change", async () => {
      for (const f of [...sel.files]) {
        if (fichiers.length >= max) { toast("Maximum " + max + " photo" + (max > 1 ? "s" : "") + " avec cette formule.", true); break; }
        try { const r = await reduirePhoto(f); fichiers.push({ r, url: URL.createObjectURL(f) }); } catch (e) { toast(e.message, true); }
      }
      sel.value = ""; dessiner();
    });
    dessiner(); return h("div", {}, zone, sel);
  }

  function formulaire() {
    const dem = !!(edition && edition.demande), a = edition && edition.id ? edition : null, creation = !a;
    const p = dem ? etat.plans[choix] : planSaisie(), f = {}, ficLieu = [], ficMenu = [];
    let lat = a ? a.lat : null, lng = a ? a.lng : null, lieu = a ? a.lieu_existant || "" : "", marqueCree = !!etat.marque, n = 0;
    const horLock = !!a && !p.horaires, hor = horLock ? null : horaires(a ? a.horaires : "");
    const champ = (cle, lib, el, aide) => [h("label", { for: "f_" + cle }, lib), el, aide ? h("p", { class: "muted" }, aide) : null];
    const inp = (cle, attrs) => f[cle] = h("input", { id: "f_" + cle, value: a ? a[cle] || "" : "", ...attrs });
    const rub = (titre, aide, ...contenu) => h("section", { class: "rubrique" }, h("h3", {}, h("span", { class: "num" }, ++n), titre), aide ? h("p", { class: "aide" }, aide) : null, ...contenu);
    f.categorie = h("select", { id: "f_categorie" }, Object.keys(CAT).map(k => h("option", { value: k, selected: (a ? a.categorie : "restaurant") === k }, EMO[k] + " " + CAT[k])));
    f.commune = h("select", { id: "f_commune" }, COMMUNES.map(c => OUVERTES.includes(c) ? h("option", { value: c, selected: (a && a.commune ? a.commune : "Gombe") === c }, c) : h("option", { value: c, disabled: true }, c + " — bientôt")));
    f.description = h("textarea", { id: "f_description", maxlength: 600, placeholder: "Ce qui vous distingue : spécialités, ambiance, services…" }); f.description.value = a ? a.description || "" : "";
    const sugg = h("div", {}), posInfo = h("p", { class: "muted" }, lat != null ? "Position enregistrée ✓" : "");
    const chercher = h("input", { id: "f_lieu", placeholder: "Tapez le nom pour la retrouver…", value: lieu, autocomplete: "off" });
    chercher.addEventListener("input", async () => {
      vider(sugg); lieu = chercher.value.trim(); const t = nrm(lieu); if (t.length < 2) return;
      const L = await chargerLieux(), r = L.filter(x => nrm(x.n).includes(t)).slice(0, 6); if (!r.length) return;
      sugg.append(h("div", { class: "sugg" }, r.map(x => h("button", { type: "button", onclick: () => {
        lieu = x.n; chercher.value = x.n; vider(sugg);
        if (!f.nom.value) f.nom.value = x.n; if (!f.adresse.value && x.a) f.adresse.value = x.a; if (x.c && CAT[x.c]) f.categorie.value = x.c;
      } }, x.n, h("small", {}, (CAT[x.c] || "") + (x.a ? " · " + x.a : ""))))));
    });

    const corps = () => ({ nom: f.nom.value, categorie: f.categorie.value, commune: f.commune.value, adresse: f.adresse.value, tel: f.tel.value, horaires: hor ? hor.valeur() : (a && a.horaires) || "", description: f.description.value, lat, lng, lieu_existant: lieu });
    async function envoyerPhotos(id, btn) {
      const tout = [...ficLieu.map(x => [x, "lieu"]), ...ficMenu.map(x => [x, "menu"])]; let echecs = 0;
      for (let i = 0; i < tout.length; i++) { btn.textContent = "Envoi des photos (" + (i + 1) + "/" + tout.length + ")…"; try { await api("POST", "commerce/photo", { adresse_id: id, type: tout[i][1], ...tout[i][0].r }); } catch (e) { echecs++; } }
      return echecs;
    }
    // « Mon commerce existe déjà sur Nexvia RDC » : bouton à côté du titre ; la fiche réclamée subit une vérification approfondie.
    const panneauReclame = h("div", { class: "reclame", hidden: true },
      h("div", { class: "alerte warn" }, h("b", {}, "Vérification approfondie."), " Cette adresse figure déjà sur Nexvia RDC. Pour éviter qu'on profite de la fiche ou de l'abonnement d'un autre, nous contrôlons que vous en êtes bien le propriétaire (appel au numéro officiel, document de l'entreprise) avant de vous l'attribuer."),
      h("label", { for: "f_lieu" }, "Retrouvez votre adresse"), chercher, sugg);
    let identite;
    const bouton = h("button", { type: "button", class: "btn alt small bouton-reclame", onclick: () => {
      panneauReclame.hidden = !panneauReclame.hidden;
      if (panneauReclame.hidden) { lieu = ""; chercher.value = ""; vider(sugg); }
