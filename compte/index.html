<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a2a6b">
<title>Mon compte – Nexvia RDC</title>
<link rel="stylesheet" href="/assets/nx.css">
</head>
<body class="auth">
<div id="app"></div>
<script src="/assets/nx.js"></script>
<script>
(async function () {
  const { h, api, entete, moi, vider, couronne, drapeau } = NX, app = document.getElementById("app");
  const q = new URLSearchParams(location.search);
  const suiteBrute = q.get("suite") || "";
  const suite = /^\/[^\/\\]/.test(suiteBrute) ? suiteBrute : ""; // uniquement un chemin du site, jamais une adresse extérieure
  let u = await moi(), mode = q.get("mode") === "inscription" ? "inscription" : "connexion", type = q.get("type") === "utilisateur" ? "utilisateur" : "commerce";
  const NOM = { gratuit: "Gratuit", standard: "Standard", premium: "Premium" };

  function aller(user) { location.href = suite || (user.type === "commerce" ? "/commerce/" : "/"); }

  const pin = () => { const ns = "http://www.w3.org/2000/svg", s = document.createElementNS(ns, "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("width", "24"); s.setAttribute("height", "24");
    const p = document.createElementNS(ns, "path"); p.setAttribute("d", "M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"); p.setAttribute("fill", "#ce1021"); s.append(p); return s; };
  const haut = (titre, sous) => h("div", {}, h("div", { class: "auth-haut" },
    h("a", { class: "logo", href: "/" }, h("span", { class: "pin" }, pin()), h("span", {}, "Nexvia ", h("b", {}, "RDC"))),
    h("div", { class: "mbote" }, drapeau(24), "Mbote !"),
    h("h1", {}, titre), h("p", {}, sous)), h("div", { class: "auth-bande" }));

  function formulaire() {
    const f = {};
    const champ = (id, lib, attrs) => [h("label", { for: id }, lib), f[id] = h("input", { id, ...attrs })];
    const msg = h("div", {});
    const insc = mode === "inscription";
    const voir = h("button", { type: "button", onclick: () => { const v = f.mdp.type === "password"; f.mdp.type = v ? "text" : "password"; voir.textContent = v ? "Masquer" : "Afficher"; } }, "Afficher");
    const form = h("form", { novalidate: true, onsubmit: async ev => {
      ev.preventDefault(); vider(msg); const btn = form.querySelector("button[type=submit]"); btn.disabled = true;
      try {
        const corps = { email: f.email.value, mot_de_passe: f.mdp.value };
        if (insc) Object.assign(corps, { nom: f.nom.value, tel: f.tel.value, type });
        const r = await api("POST", insc ? "auth/inscription" : "auth/connexion", corps);
        aller(r.utilisateur);
      } catch (e) { msg.append(h("div", { class: "alerte bad" }, e.message)); btn.disabled = false; }
    } },
      insc ? [
        h("label", {}, "Vous êtes"),
        h("div", { class: "onglets" },
          h("button", { type: "button", class: type === "commerce" ? "actif" : "", onclick: () => { type = "commerce"; rendre(); } }, "Un commerce"),
          h("button", { type: "button", class: type === "utilisateur" ? "actif" : "", onclick: () => { type = "utilisateur"; rendre(); } }, "Un utilisateur")),
        champ("nom", type === "commerce" ? "Votre nom" : "Votre nom ou pseudo", { autocomplete: "name", required: true, maxlength: 80 }),
        champ("tel", "Téléphone (WhatsApp de préférence)", { type: "tel", autocomplete: "tel", maxlength: 30 }),
      ] : null,
      champ("email", "Adresse e-mail", { type: "email", autocomplete: "email", required: true, maxlength: 120, inputmode: "email" }),
      h("label", { for: "mdp" }, insc ? "Mot de passe (8 caractères minimum)" : "Mot de passe"),
      h("div", { class: "oeil" }, f.mdp = h("input", { id: "mdp", type: "password", autocomplete: insc ? "new-password" : "current-password", required: true, maxlength: 100 }), voir),
      msg,
      h("p", { style: "margin-top:16px" }, h("button", { class: "btn gold grand", type: "submit" }, insc ? "Créer mon compte" : "Me connecter")),
      insc ? h("p", { class: "muted" }, "Le compte est gratuit. Les utilisateurs n'ont jamais besoin d'en créer un pour chercher un lieu sur la carte.") : h("p", { class: "muted" }, "Mot de passe oublié ? Écrivez-nous sur WhatsApp : nous le réinitialisons.")
    );
    return form;
  }

  function rendre() {
    vider(app);
    if (u) {
      const plan = u.plan;
      app.append(haut("Bonjour " + (u.nom || ""), u.email),
        h("div", { class: "auth-carte" }, h("div", { class: "boite" },
          h("div", { class: "row between" },
            h("b", {}, u.commerce || "Mon compte"),
            h("span", { class: "pastille-formule " + (plan || "gratuit") }, couronne(plan, 16), NOM[plan || "gratuit"])),
          h("p", { class: "muted" }, u.commerce ? "Votre espace commerce : fiche, photos, abonnement." : "Votre compte est prêt. Créez votre commerce pour apparaître sur la carte."),
          h("p", {}, h("a", { class: "btn gold grand", href: "/commerce/" }, u.commerce ? "Ouvrir mon espace commerce" : "Créer mon commerce")),
          u.admin ? h("p", {}, h("a", { class: "btn teal grand", href: "/admin/" }, "Administration")) : null,
          h("p", {}, h("a", { class: "btn fantome grand", href: "/" }, "Retour à l'accueil")),
          h("p", { style: "text-align:center" }, h("button", { class: "btn alt small", onclick: async () => { try { await api("POST", "auth/deconnexion"); } catch (e) {} u = null; rendre(); } }, "Me déconnecter")))));
    } else {
      const insc = mode === "inscription";
      app.append(haut(insc ? "Faites-vous trouver à Gombe" : "Bon retour !", insc ? "Créez votre compte gratuit et présentez votre commerce aux habitants de Kinshasa." : "Connectez-vous pour gérer votre commerce."),
        h("div", { class: "auth-carte" }, h("div", { class: "boite" },
          h("div", { class: "onglets" },
            h("button", { class: mode === "connexion" ? "actif" : "", onclick: () => { mode = "connexion"; rendre(); } }, "Connexion"),
            h("button", { class: mode === "inscription" ? "actif" : "", onclick: () => { mode = "inscription"; rendre(); } }, "Créer un compte")),
          formulaire(),
          insc && type === "commerce" ? h("ul", { class: "avantages" }, h("li", {}, "Formule Gratuit : 1 adresse, sans carte bancaire"), h("li", {}, "Vous choisissez ensuite Gratuit, Standard ou Premium"), h("li", {}, "Nous vérifions votre fiche avant de la publier")) : null),
          h("p", { class: "auth-pied" }, h("a", { href: "/tarifs/" }, "Voir les tarifs"), " · ", h("a", { href: "/" }, "Retour à la carte"))));
    }
  }
  rendre();
})();
</script>
</body>
</html>
