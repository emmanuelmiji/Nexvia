<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a2a6b">
<title>Administration – Nexvia RDC</title>
<link rel="stylesheet" href="/assets/nx.css">
</head>
<body>
<div id="app"><main><p class="muted">Chargement…</p></main></div>
<script src="/assets/nx.js"></script>
<script>
(async function () {
  const { h, api, toast, entete, vider, wa, date, dollars, chiffres, drapeau, etoile, horairesJolis } = NX, app = document.getElementById("app");
  const NOM = { gratuit: "Gratuit", standard: "Standard", premium: "Premium" }, PRIX = { standard: 3.3, premium: 5.3 };
  const CAT = { restaurant: "Restaurant", pharmacie: "Pharmacie", banque: "Banque", hotel: "Hôtel", bar: "Bar / loisirs", ecole: "École", distributeur: "Distributeur", "station-service": "Station-service", autre: "Autre" };
  let d = null, bilan = null, mdpTemp = null, onglet = null;

  async function charger() {
    try { d = await api("GET", "admin/file"); }
    catch (e) {
      if (e.status === 401) { location.href = "/compte/?suite=/admin/"; return; }
      vider(app); app.append(h("main", {}, h("h1", {}, "Accès refusé"), h("div", { class: "alerte bad" }, e.message), h("p", {}, h("a", { href: "/" }, "Retour à la carte")))); return;
    }
    if (onglet === null) onglet = d.a_verifier.length ? "paiements" : (d.marques.length || d.adresses.length) ? "validations" : d.en_attente.length ? "paiements" : "validations";
    rendre();
  }
  async function agir(btn, fn, ok) { btn.disabled = true; try { await fn(); if (ok) toast(ok); await charger(); } catch (e) { toast(e.message, true); btn.disabled = false; } }
  const pastille = n => n ? h("span", { class: "compteur" }, n) : null;
  const vide = (icone, txt) => h("div", { class: "vide-ok" }, h("b", {}, icone), txt);
  const sec = (txt, n) => h("h2", { class: "sec" }, etoile(16), txt, pastille(n));

  // ---------- paiements ----------
  function ligneVerif(x) {
    const nomPlan = NOM[x.plan] || x.plan;
    const msg = "Bonjour, concernant votre abonnement " + nomPlan + " sur Nexvia RDC (référence " + x.ref + ") : nous n'avons pas pu valider votre paiement. " + (x.motif || "") + " Pouvez-vous vérifier votre numéro de référence ou nous envoyer la capture du paiement ?";
    const num = chiffres(x.user_tel);
    return h("div", { class: "card dem rouge" },
      h("div", { class: "row between" }, h("h3", {}, x.marque_nom), h("span", { class: "badge gris" }, nomPlan + " · " + dollars(PRIX[x.plan]))),
      h("p", { class: "muted" }, x.email + (x.user_tel ? " · " + x.user_tel : "") + " · " + date(x.created_at)),
      h("p", {}, "Référence : ", h("span", { class: "code" }, x.ref)),
      x.motif ? h("p", { class: "muted" }, "Motif : " + x.motif) : null,
      h("div", { class: "row" },
        h("button", { class: "btn teal small", onclick: ev => { if (confirm("Activer l'abonnement " + nomPlan + " pour « " + x.marque_nom + " » ? Vérifiez d'abord le paiement dans Zola.")) agir(ev.target, () => api("POST", "admin/activer", { demande_id: x.id }), "Abonnement activé."); } }, "Activer à la main"),
        h("a", { class: "btn wa small", href: wa(msg, num.length >= 9 ? num : undefined), target: "_blank", rel: "noopener" }, "Écrire au commerce"),
        h("button", { class: "btn danger small", onclick: ev => { const n = prompt("Motif du rejet (visible dans le dossier) :", "Paiement introuvable chez Zola"); if (n !== null) agir(ev.target, () => api("POST", "admin/rejeter", { demande_id: x.id, note: n }), "Demande rejetée."); } }, "Rejeter")));
  }
  function importBloc() {
    const f = h("input", { type: "file", accept: ".csv,text/csv,text/plain" }), res = h("div", {});
    return h("div", { class: "card gold" },
      h("h3", {}, "📥 Importer l'historique Zola"),
      h("p", { class: "muted" }, "Dans Zola : Historique → Export CSV. Déposez le fichier ici : les paiements confirmés sont rapprochés des références saisies par les commerces et les abonnements s'activent tout seuls."),
      f, h("p", {}, h("button", { class: "btn gold", onclick: async ev => {
        const fi = f.files[0]; if (!fi) return toast("Choisissez d'abord le fichier CSV.", true);
        const btn = ev.target; btn.disabled = true; vider(res);
        try { const r = await api("POST", "admin/import", { csv: await fi.text() }); bilan = r; toast(r.activees + " abonnement(s) activé(s)."); await charger(); }
        catch (e) { res.append(h("div", { class: "alerte bad" }, e.message)); btn.disabled = false; }
      } }, "Importer et rapprocher")), res,
      bilan ? h("div", { class: "alerte ok" }, "Dernier import : " + bilan.lignes + " lignes lues, " + bilan.paiements + " paiements, " + bilan.reversements + " reversements. ", h("b", {}, bilan.activees + " abonnement(s) activé(s)"), ", " + bilan.a_verifier + " à vérifier.") : null,
      d.imports.length ? h("p", { class: "muted" }, "Imports précédents : " + d.imports.map(i => date(i.ts) + " (" + i.activees + " activé(s))").join(" · ")) : h("p", { class: "muted" }, "Aucun import pour l'instant."));
  }
  const tableAttente = () => h("div", { class: "card" }, h("table", { class: "t" }, h("tr", {}, h("th", {}, "Commerce"), h("th", {}, "Formule"), h("th", {}, "Référence"), h("th", {}, "Imports")),
    d.en_attente.map(x => h("tr", {}, h("td", {}, x.marque_nom), h("td", {}, NOM[x.plan]), h("td", {}, h("span", { class: "code", style: "font-size:.8rem" }, x.ref)), h("td", {}, x.tentatives + "/2")))));

  // ---------- validations ----------
  function carteMarque(m) {
    return h("div", { class: "card dem" },
      h("h3", {}, "🏪 " + m.nom), h("p", { class: "muted" }, m.user_nom + " · " + m.email + (m.user_tel ? " · " + m.user_tel : "") + " · " + date(m.created_at)),
      m.plan_souhaite && m.plan_souhaite !== "gratuit" ? h("p", {}, h("span", { class: "badge warn" }, "Formule choisie : " + NOM[m.plan_souhaite])) : null,
      h("p", { class: "muted" }, "Vérifiez que cette personne représente bien la marque (document de l'entreprise, ou appel au numéro officiel)."),
      h("div", { class: "row" },
        h("button", { class: "btn teal small", onclick: ev => agir(ev.target, () => api("POST", "admin/marque", { id: m.id, action: "valider" }), "Marque validée.") }, "Valider la marque"),
        h("button", { class: "btn danger small", onclick: ev => { const n = prompt("Motif du refus (visible par le commerce) :", ""); if (n !== null) agir(ev.target, () => api("POST", "admin/marque", { id: m.id, action: "refuser", note: n }), "Marque refusée."); } }, "Refuser")));
  }
  const rangee = (icone, txt) => txt ? h("div", { class: "row", style: "align-items:flex-start;gap:8px;margin:4px 0;flex-wrap:nowrap" }, h("span", {}, icone), h("span", {}, txt)) : null;
  const galerie = (ids, cls) => ids && ids.length ? h("div", { class: "photos " + (cls || "") }, ids.map(id => h("a", { href: "/api/photo/" + id, target: "_blank", rel: "noopener", class: "ph" }, h("img", { src: "/api/photo/" + id, alt: "Photo", loading: "lazy" })))) : null;
  function carteAdresse(a) {
    const choisie = NOM[a.plan_souhaite] || "Gratuit", payant = a.plan_souhaite && a.plan_souhaite !== "gratuit";
    return h("div", { class: "card dem" },
      h("div", { class: "row between" }, h("h3", {}, a.nom), h("span", { class: "badge " + (a.tel_verifie ? "ok" : "warn") }, a.tel_verifie ? "Numéro vérifié" : "Numéro non vérifié")),
      h("p", { class: "muted" }, "Marque : " + a.marque_nom + (a.marque_statut !== "validee" ? " (non validée)" : "") + " · " + a.email),
      h("p", {}, h("span", { class: "badge " + (a.plan_effectif !== "gratuit" ? "ok" : payant ? "warn" : "gris") }, "Formule choisie : " + choisie + (payant ? (a.plan_effectif === a.plan_souhaite ? " · payée" : " · pas encore payée") : "")), " ", h("span", { class: "badge gris" }, CAT[a.categorie] || "Autre")),
      rangee("🏠", a.adresse + (a.commune ? ", " + a.commune : "")), rangee("📞", a.tel),
      rangee("🕘", a.horaires ? horairesJolis(a.horaires).join(" · ") : ""), rangee("📝", a.description),
      a.lieu_existant ? h("div", { class: "alerte bad" }, h("b", {}, "⚠️ Réclame une fiche existante : " + a.lieu_existant + "."), " Vérification approfondie obligatoire : appelez le numéro officiel du commerce ou demandez un document (RCCM, facture, pièce d'identité du gérant) avant de valider. Ne laissez personne profiter de la fiche ou de l'abonnement d'un autre.") : null,
      h("h3", { style: "margin-top:10px" }, "📷 Photos du lieu"), galerie(a.photos) || h("p", { class: "muted" }, "Aucune photo envoyée."),
      a.menu_photos && a.menu_photos.length ? [h("h3", { style: "margin-top:6px" }, "📋 Menu (photos)"), galerie(a.menu_photos, "menus")] : null,
      h("p", { style: "margin-top:10px" }, "Code attendu par WhatsApp : ", h("span", { class: "code" }, a.code), " (doit venir du numéro ", h("b", {}, a.tel), ")"),
      h("div", { class: "row" },
        a.tel_verifie ? null : h("button", { class: "btn alt small", onclick: ev => agir(ev.target, () => api("POST", "admin/adresse", { id: a.id, action: "tel_ok" }), "Numéro marqué vérifié.") }, "Code reçu : numéro vérifié"),
        h("button", { class: "btn teal small", onclick: ev => { if ((a.tel_verifie || confirm("Le numéro n'est pas marqué comme vérifié. Valider quand même ?")) && (!a.lieu_existant || confirm("Cette adresse réclame la fiche existante « " + a.lieu_existant + " ». Avez-vous vérifié que la personne en est bien le propriétaire ?"))) agir(ev.target, () => api("POST", "admin/adresse", { id: a.id, action: "valider" }), "Adresse validée."); } }, "Valider l'adresse"),
        h("button", { class: "btn danger small", onclick: ev => { const n = prompt("Motif du refus (visible par le commerce) :", ""); if (n !== null) agir(ev.target, () => api("POST", "admin/adresse", { id: a.id, action: "refuser", note: n }), "Adresse refusée."); } }, "Refuser")));
  }

  // ---------- outils ----------
  function mdpBloc() {
    const e = h("input", { type: "email", placeholder: "e-mail du commerçant", maxlength: 120 });
    return h("div", { class: "card" }, h("h3", {}, "🔑 Mot de passe oublié"), h("p", { class: "muted" }, "Génère un mot de passe temporaire à transmettre au commerçant (par WhatsApp). Ses sessions en cours sont fermées."), e,
      h("p", {}, h("button", { class: "btn alt small", onclick: async ev => { ev.target.disabled = true; try { const r = await api("POST", "admin/motdepasse", { email: e.value }); mdpTemp = { email: e.value, mdp: r.mot_de_passe_temporaire }; rendre(); } catch (er) { toast(er.message, true); ev.target.disabled = false; } } }, "Générer un mot de passe temporaire")),
      mdpTemp ? h("div", { class: "alerte ok" }, "Mot de passe temporaire pour " + mdpTemp.email + " : ", h("span", { class: "code" }, mdpTemp.mdp), h("br", {}), h("span", { class: "muted" }, "Il ne sera plus affichable après avoir quitté cette page.")) : null);
  }
  const raccourcis = () => h("div", { class: "card" }, h("h3", {}, "🔗 Raccourcis"),
    h("div", { class: "row" }, h("a", { class: "btn alt small", href: NX.CFG.ZOLA_LIEN, target: "_blank", rel: "noopener" }, "Page de paiement Zola"), h("a", { class: "btn alt small", href: "/", target: "_blank" }, "L'application"), h("a", { class: "btn alt small", href: "/tarifs/", target: "_blank" }, "Les tarifs"), h("a", { class: "btn wa small", href: wa("Bonjour"), target: "_blank", rel: "noopener" }, "WhatsApp Nexvia")));

  // ---------- page ----------
  function rendre() {
    vider(app); app.append(entete({ admin: true, type: "commerce" }));
    const s = d.stats, nPay = d.a_verifier.length, nVal = d.marques.length + d.adresses.length;
    const kpi = (n, t) => h("div", { class: "kpi" }, h("b", {}, n), h("span", {}, t));
    app.append(h("div", { class: "hero-com" }, h("div", { class: "in", style: "max-width:1100px" },
      h("div", { class: "mbote" }, drapeau(26), h("span", {}, "Mbote ! Poste de commande")), h("h1", {}, "Administration"),
      h("div", { class: "kpis" }, kpi(s.comptes, s.comptes > 1 ? "comptes" : "compte"), kpi(s.marques, s.marques > 1 ? "commerces" : "commerce"), kpi(s.adresses_validees, s.adresses_validees > 1 ? "adresses validées" : "adresse validée"), kpi(s.abonnes, s.abonnes > 1 ? "abonnés actifs" : "abonné actif")))),
      h("div", { class: "bande-rdc" }));
    const tab = (cle, lib, n) => h("button", { class: onglet === cle ? "on" : "", onclick: () => { onglet = cle; rendre(); } }, lib, pastille(n));
    app.append(h("div", { class: "onglets-admin" }, tab("validations", "✅ Validations", nVal), tab("paiements", "💳 Paiements", nPay), tab("outils", "🧰 Outils")));
    const main = h("main", { class: "large" });
    if (onglet === "validations") {
      main.append(h("div", { class: "cols" },
        h("div", {}, sec("Commerces à valider", d.marques.length), ...(d.marques.length ? d.marques.map(carteMarque) : [vide("✓", "Aucun commerce à valider.")])),
        h("div", {}, sec("Adresses à valider", d.adresses.length), ...(d.adresses.length ? d.adresses.map(carteAdresse) : [vide("✓", "Aucune adresse à valider.")]))));
    } else if (onglet === "paiements") {
      main.append(h("div", { class: "cols" },
        h("div", {}, sec("Importer le CSV"), importBloc()),
        h("div", {}, sec("Paiements à vérifier", d.a_verifier.length), ...(d.a_verifier.length ? d.a_verifier.map(ligneVerif) : [vide("✓", "Rien à vérifier.")]),
          sec("En attente de l'import", d.en_attente.length), d.en_attente.length ? tableAttente() : vide("·", "Aucun paiement en attente."))));
    } else {
      main.append(h("div", { class: "cols" }, h("div", {}, sec("Comptes"), mdpBloc()), h("div", {}, sec("Outils"), raccourcis())));
    }
    main.append(h("div", { class: "pied-rdc" }, drapeau(22), "Nexvia RDC · fait à Kinshasa"));
    app.append(main);
  }
  charger();
})();
</script>
</body>
</html>
