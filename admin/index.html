    const kpi = (n, t) => h("div", { class: "kpi" }, h("b", {}, n), h("span", {}, t));
    app.append(h("div", { class: "hero-com" }, h("div", { class: "in", style: "max-width:1100px" },
      h("div", { class: "mbote" }, drapeau(26), h("span", {}, "Mbote ! Poste de commande")), h("h1", {}, "Administration"),
      h("div", { class: "kpis" }, kpi(s.comptes, s.comptes > 1 ? "comptes" : "compte"), kpi(s.marques, s.marques > 1 ? "commerces" : "commerce"), kpi(s.adresses_validees, s.adresses_validees > 1 ? "adresses validées" : "adresse validée"), kpi(s.abonnes, s.abonnes > 1 ? "abonnés actifs" : "abonné actif")))),
      h("div", { class: "bande-rdc" }));
    const tab = (cle, lib, n) => h("button", { class: onglet === cle ? "on" : "", onclick: () => { onglet = cle; rendre(); } }, lib, pastille(n));
    app.append(h("div", { class: "onglets-admin" }, tab("validations", "✅ Validations", nVal), tab("paiements", "💳 Paiements", nPay), tab("comptes", "👥 Comptes", s.reclamations), tab("recup", "🔑 Récupération"), tab("outils", "🧰 Outils")));
    const main = h("main", { class: "large" });
    if (onglet === "validations") {
      main.append(h("div", { class: "cols" },
        h("div", {}, sec("Commerces à valider", d.marques.length), ...(d.marques.length ? d.marques.map(carteMarque) : [vide("✓", "Aucun commerce à valider.")])),
        h("div", {}, sec("Adresses à valider", d.adresses.length), ...(d.adresses.length ? d.adresses.map(carteAdresse) : [vide("✓", "Aucune adresse à valider.")]))));
    } else if (onglet === "paiements") {
      main.append(h("div", { class: "cols" },
        h("div", {}, sec("Importer le CSV"), importBloc()),
        h("div", {}, sec("Paiements à vérifier", d.a_verifier.length), ...(d.a_verifier.length ? d.a_verifier.map(ligneVerif) : [vide("✓", "Rien à vérifier.")]),
          sec("En attente de l'import", d.en_attente.length), d.en_attente.length ? tableAttente() : vide("·", "Aucun paiement en attente."))));
    } else {
      main.append(onglet === "comptes" ? h("div", { class: "cols" }, h("div", {}, sec("Comptes des utilisateurs"), comptesBloc()))
        : onglet === "recup" ? h("div", { class: "cols" }, h("div", {}, sec("Récupération de compte"), recupBloc()), h("div", {}, sec("E-mails"), mailEtat()))
        : h("div", { class: "cols" }, h("div", {}, sec("Outils"), raccourcis())));
    }
    main.append(h("div", { class: "pied-rdc" }, drapeau(22), "Nexvia RDC · fait à Kinshasa"));
    app.append(main);
  }
  charger();
})();
