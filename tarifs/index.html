<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>Tarifs commerces – Nexvia RDC</title>
<meta name="description" content="Nexvia RDC : faites-vous trouver à Gombe, Kinshasa. Formules Gratuit, Standard (3,30 $/mois) et Premium (5,30 $/mois) pour les restaurants, pharmacies, hôtels et commerces.">
<link rel="canonical" href="https://nexvia-rdc.pages.dev/tarifs/">
<link rel="stylesheet" href="/assets/nx.css">
</head>
<body>
<div id="app"></div>
<noscript><main><h1>Tarifs commerces</h1><p>Gratuit : 1 adresse. Standard : 3,30 $ par mois, 2 adresses. Premium : 5,30 $ par mois, 6 adresses. Activez JavaScript pour voir le détail.</p></main></noscript>
<script src="/assets/nx.js"></script>
<script>
(async function () {
  const { h, entete, moi, dollars } = NX, app = document.getElementById("app");
  const u = await moi();
  // Mêmes règles que le serveur (functions/_lib/core.js) : le serveur reste la référence.
  const L = (ok, t) => h("li", { class: ok ? "" : "non" }, t);
  const plan = (cls, nom, prixTxt, sous, lignes, cta) => h("div", { class: "plan " + cls },
    h("h3", {}, nom), h("div", { class: "prix" }, prixTxt, h("small", {}, sous || "")), h("ul", {}, lignes), cta);
  const cta = h("a", { class: "btn gold", href: u ? "/commerce/" : "/compte/?mode=inscription&type=commerce" }, u ? "Ouvrir mon espace commerce" : "Créer mon compte commerce");
  app.append(entete(u), h("main", {},
    h("h1", {}, "Faites-vous trouver à Gombe"),
    h("p", {}, "Nexvia RDC est gratuit pour tous ceux qui cherchent un lieu. Les commerces choisissent une formule pour mieux apparaître et garder leur fiche à jour."),
    h("div", { class: "plans" },
      plan("", "Gratuit", "0 $", "", [L(1, "1 adresse"), L(1, "1 photo"), L(1, "Horaires saisis à la création"), L(0, "Menu / services en photos"), L(0, "Badge « Vérifié »"), L(0, "Bouton WhatsApp direct")], cta.cloneNode(true)),
      plan("vedette", "Standard", dollars(3.3), " / mois", [L(1, "2 adresses"), L(1, "5 photos par adresse"), L(1, "Horaires modifiables"), L(1, "Menu en photos : 3 photos, 2 changements par mois"), L(1, "Badge « Vérifié »"), L(1, "Bouton WhatsApp direct")], cta.cloneNode(true)),
      plan("", "Premium", dollars(5.3), " / mois", [L(1, "6 adresses"), L(1, "15 photos par adresse"), L(1, "Menu en photos : 10 photos, changements illimités"), L(1, "Badge « Vérifié » et WhatsApp"), L(1, "En haut de votre catégorie"), L(1, "Statistiques de vues et d'appels"), L(1, "Mise en avant sur nos réseaux")], cta.cloneNode(true))),
    h("div", { class: "card gold" },
      h("h3", {}, "Frais de transaction"),
      h("p", {}, "Le paiement se fait par mobile money (Orange Money, M-Pesa, Airtel Money, Afrimoney) ou par carte. Des frais de transaction du service de paiement s'ajoutent au montant : environ ", h("b", {}, dollars(3.61)), " au total pour Standard et ", h("b", {}, dollars(5.8)), " pour Premium."),
      h("p", { class: "muted" }, "Un abonnement dure 30 jours. Plus de 6 adresses (une chaîne, par exemple) : écrivez-nous pour une offre sur mesure.")),
    h("div", { class: "card" },
      h("h3", {}, "Comment ça marche ?"),
      h("ol", {}, h("li", {}, "Créez votre compte commerce et ajoutez votre adresse."), h("li", {}, "Nous vérifions votre numéro de téléphone par WhatsApp, puis validons votre fiche."), h("li", {}, "Choisissez une formule, payez, puis saisissez votre référence de paiement : l'abonnement est activé sous 24 heures."))),
    h("p", { class: "muted" }, "Une question ? ", h("a", { href: NX.wa("Bonjour Nexvia RDC, j'ai une question sur les abonnements pour les commerces.") }, "Écrivez-nous sur WhatsApp"), "."),
    h("p", { class: "muted" }, h("a", { href: "/confidentialite.html" }, "Politique de confidentialité"))));
})();
</script>
</body>
</html>
